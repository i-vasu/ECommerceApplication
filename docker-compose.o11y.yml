version: '3.8'

services:
  banyandb:
    image: apache/skywalking-banyandb:0.5.0
    container_name: skywalking-banyandb
    command: standalone
    environment:
      - BYDB_LOG_LEVEL=info
    deploy:
      resources:
        limits:
          memory: 1G
    ports:
      - "17912:17912"
      - "17913:17913"

  skywalking-oap:
    image: apache/skywalking-oap-server:9.5.0
    container_name: skywalking-oap
    depends_on:
      - banyandb
    restart: on-failure
    environment:
      SW_STORAGE: banyandb
      SW_STORAGE_BANYANDB_TARGETS: banyandb:17912
      JAVA_OPTS: "-Xms2g -Xmx2g"
    deploy:
      resources:
        limits:
          memory: 4G
    ports:
      - "11800:11800"
      - "12800:12800"

  skywalking-ui:
    image: apache/skywalking-ui:9.5.0
    container_name: skywalking-ui
    depends_on:
      - skywalking-oap
    environment:
      SW_OAP_ADDRESS: http://skywalking-oap:12800
    ports:
      - "8081:8080"

  redis:
    image: redis:7-alpine
    container_name: java-middleware-redis
    ports:
      - "6380:6379"
    deploy:
      resources:
        limits:
          memory: 512M
