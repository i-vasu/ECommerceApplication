<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Order Confirmation</title>
</head>
<body style="font-family: Arial, sans-serif;">
    <div style="background-color: #f8f9fa; padding: 20px;">
        <h1 style="color: #333;">Order Confirmed!</h1>
        <p>Dear Customer,</p>
        <p>Thank you for your order. We are excited to get your fashion items to you.</p>
        
        <div style="background-color: #fff; padding: 15px; border-radius: 5px;">
            <h3>Order Details</h3>
            <p><strong>Order ID:</strong> <span th:text="${orderId}">#12345</span></p>
            <p><strong>Total Amount:</strong> <span th:text="${amount}">$199.99</span></p>
            <p><strong>Transaction ID:</strong> <span th:text="${paymentId}">TXN_123</span></p>
        </div>
        
        <p>You can track your order status on your profile page.</p>
        <p>Happy Shopping!</p>
    </div>
</body>
</html>
