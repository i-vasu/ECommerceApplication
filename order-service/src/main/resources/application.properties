#db config
spring.application.name=ecommerce-service
server.port=8081
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/dev}
spring.datasource.username=${JAVA_DB_USERNAME:postgres}
spring.datasource.password=${JAVA_DB_PASSWORD:123Vasu456}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata

# Redis Caching
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
cache.type=redis

#image
project.image=images/
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

#JWT Security Key
jwt_secret=${JAVA_JWT_SECRET:cl$ksc^nas%lkdm!cz@xclk#as&dmka;s28*392da%jskd#n9827@3498%}

# ERPNext Integration
erpnext.api.url=${ERPNEXT_API_URL:http://localhost:8000/api/resource/Item}
erpnext.api.key=${ERPNEXT_API_KEY}
erpnext.api.secret=${ERPNEXT_API_SECRET}

# Razorpay
razorpay.key.id=${RAZORPAY_KEY_ID:rzp_test_12345678}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:secret123}

# Shadowfax
shadowfax.token=${SHADOWFAX_TOKEN:test_token}

# Shiprocket Configuration
shiprocket.api.url=${SHIPROCKET_API_URL:https://apiv2.shiprocket.in/v1/external}
shiprocket.email=${SHIPROCKET_EMAIL:}
shiprocket.password=${SHIPROCKET_PASSWORD:}
shiprocket.pickup.location=${SHIPROCKET_PICKUP_LOCATION:Primary}
shiprocket.channel.id=${SHIPROCKET_CHANNEL_ID:}

# Shipping Provider (SHIPROCKET or SHADOWFAX)
shipping.provider=${SHIPPING_PROVIDER:SHIPROCKET}

#Swagger OpenAPI
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.doc-expansion=false

# MinIO Configuration
minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
minio.accessKey=${MINIO_ACCESS_KEY:minioadmin}
minio.secretKey=${MINIO_SECRET_KEY:minioadmin}
minio.bucket=${MINIO_BUCKET:fashion-store}

# Logging
logging.level.org.springframework.security=debug

# OAuth2 Resource Server (Keycloak)
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KC_ISSUER_URI:http://localhost:8082/realms/fashion-store}

# Virtual Threads
spring.threads.virtual.enabled=true