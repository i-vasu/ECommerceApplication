spring.application.name=ecommerce-service
server.port=8081
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${JAVA_DB_USERNAME:sa}
spring.datasource.password=${JAVA_DB_PASSWORD:}
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Redis Caching - Disable for tests if possible or use embedded. For now, try pointing to localhost or mock.
# Since we don't have embedded redis easily, we might get errors if redis is missing.
# Let's see if we can disable cache or if testcontainers is needed.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
cache.type=none

# JWT
jwt_secret=${JAVA_JWT_SECRET:testsecret}

# ERPNext
erpnext.api.url=${ERPNEXT_API_URL:http://localhost:8000}
erpnext.api.key=${ERPNEXT_API_KEY:test}
erpnext.api.secret=${ERPNEXT_API_SECRET:test}

# Razorpay
razorpay.key.id=test
razorpay.key.secret=test

# Shadowfax
shadowfax.token=test

# MinIO - Mocking or pointing to localhost (will fail if not running)
# We might need to mock the service using it.
minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
minio.accessKey=${MINIO_ACCESS_KEY:minioadmin}
minio.secretKey=${MINIO_SECRET_KEY:minioadmin}
minio.bucket=${MINIO_BUCKET:fashion-store}

# OAuth2 - we might need to mock this or disable security in tests
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/test
