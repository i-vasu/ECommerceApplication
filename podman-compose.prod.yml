version: '3.8'

services:
  db:
    image: paradedb/paradedb:latest
    container_name: vaabhi-postgres
    restart: always
    environment:
      POSTGRES_DB: vaabhi_prod
      POSTGRES_USER: ${PROD_DB_USER:-vaabhi_admin}
      POSTGRES_PASSWORD: ${PROD_DB_PASSWORD:?database password required}
    volumes:
      - vaabhi_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
    networks:
      - vaabhi-net

  dragonfly:
    image: 'ghcr.io/dragonflydb/dragonfly:latest'
    container_name: vaabhi-cache
    restart: always
    command: >
      dragonfly --proactor_threads=2 --maxmemory 1gb
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
    networks:
      - vaabhi-net

  modulith-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: vaabhi-backend:latest
    container_name: vaabhi-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
      dragonfly:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/vaabhi_prod
      JAVA_DB_USERNAME: ${PROD_DB_USER:-vaabhi_admin}
      JAVA_DB_PASSWORD: ${PROD_DB_PASSWORD}
      REDIS_HOST: dragonfly
      REDIS_PORT: 6379
    networks:
      - vaabhi-net

  vaabhi-storefront:
    build:
      context: ../vaabhi-storefront
      dockerfile: Dockerfile
    image: vaabhi-storefront:latest
    container_name: vaabhi-storefront
    restart: always
    environment:
      BACKEND_API_URL: http://vaabhi-backend:8080/api
      NODE_ENV: production
    networks:
      - vaabhi-net

  caddy:
    image: caddy:latest
    container_name: vaabhi-gateway
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile.prod:/etc/caddy/Caddyfile
      - vaabhi_caddy_data:/data
      - vaabhi_caddy_config:/config
    depends_on:
      - modulith-service
      - vaabhi-storefront
    networks:
      - vaabhi-net

networks:
  vaabhi-net:
    driver: bridge

volumes:
  vaabhi_postgres_data:
  vaabhi_caddy_data:
  vaabhi_caddy_config:
