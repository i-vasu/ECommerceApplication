<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>VAABHI Admin Login</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 h-screen flex items-center justify-center">
    <div class="bg-white p-8 rounded-lg shadow-lg w-96">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-gray-800">VAABHI Admin</h1>
            <p class="text-gray-500 text-sm">Business Management Console</p>
        </div>
        
        <form th:action="@{/admin/login}" method="post" class="space-y-6">
            <div th:if="${param.error}" class="bg-red-50 text-red-500 p-3 rounded text-sm text-center">
                Invalid credentials
            </div>
            <div th:if="${param.logout}" class="bg-green-50 text-green-500 p-3 rounded text-sm text-center">
                Logged out successfully
            </div>

            <div>
                <label for="username" class="block text-sm font-medium text-gray-700">Email</label>
                <input type="text" id="username" name="username" required 
                       class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
            </div>

            <div>
                <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
                <input type="password" id="password" name="password" required 
                       class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
            </div>

            <button type="submit" 
                    class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                Sign In
            </button>
        </form>
        
        <div class="mt-6 text-center">
            <a href="/login" class="text-xs text-gray-400 hover:text-gray-600">Switch to Technical Console</a>
        </div>
    </div>
</body>
</html>
