<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title th:text="${pageTitle} + ' - Vasu Admin'">Dashboard - Vasu Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            font-family: 'Outfit', sans-serif;
        }
    </style>
</head>

<body class="bg-gray-50 flex h-screen overflow-hidden">

    <!-- Sidebar -->
    <aside class="w-64 bg-white shadow-xl z-20 flex flex-col">
        <div class="h-16 flex items-center justify-center border-b border-gray-100">
            <h1
                class="text-2xl font-bold bg-gradient-to-r from-purple-600 to-indigo-600 bg-clip-text text-transparent tracking-tight">
                Vasu Admin</h1>
        </div>

        <nav class="flex-1 px-4 py-6 space-y-1 overflow-y-auto">
            <a href="/admin/dashboard"
                class="flex items-center px-4 py-3 text-purple-600 bg-purple-50 rounded-xl transition-all duration-200 font-medium">
                <i data-lucide="layout-dashboard" class="w-5 h-5 mr-3"></i>
                Dashboard
            </a>
            <a href="/admin/products"
                class="flex items-center px-4 py-3 text-gray-600 hover:bg-gray-50 hover:text-purple-600 rounded-xl transition-all duration-200 font-medium group">
                <i data-lucide="package" class="w-5 h-5 mr-3 group-hover:text-purple-600 transition-colors"></i>
                Products
            </a>
            <a href="/admin/orders"
                class="flex items-center px-4 py-3 text-gray-600 hover:bg-gray-50 hover:text-purple-600 rounded-xl transition-all duration-200 font-medium group">
                <i data-lucide="shopping-bag" class="w-5 h-5 mr-3 group-hover:text-purple-600 transition-colors"></i>
                Orders
            </a>
            <a href="/admin/customers"
                class="flex items-center px-4 py-3 text-gray-600 hover:bg-gray-50 hover:text-purple-600 rounded-xl transition-all duration-200 font-medium group">
                <i data-lucide="users" class="w-5 h-5 mr-3 group-hover:text-purple-600 transition-colors"></i>
                Customers
            </a>
            <a href="/admin/settings"
                class="flex items-center px-4 py-3 text-gray-600 hover:bg-gray-50 hover:text-purple-600 rounded-xl transition-all duration-200 font-medium group">
                <i data-lucide="settings" class="w-5 h-5 mr-3 group-hover:text-purple-600 transition-colors"></i>
                Settings
            </a>
        </nav>

        <div class="p-4 border-t border-gray-100">
            <form th:action="@{/admin/logout}" method="post">
                <button type="submit"
                    class="flex items-center w-full px-4 py-2 text-gray-500 hover:text-red-600 transition-colors rounded-lg hover:bg-red-50">
                    <i data-lucide="log-out" class="w-5 h-5 mr-3"></i>
                    Sign Out
                </button>
            </form>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col overflow-hidden relative">
        <!-- Header -->
        <header
            class="h-16 bg-white/80 backdrop-blur-md shadow-sm flex items-center justify-between px-8 z-10 w-full sticky top-0">
            <div class="text-xl font-semibold text-gray-800" th:text="${pageTitle}">Dashboard</div>
            <div class="flex items-center space-x-4">
                <button class="relative p-2 text-gray-400 hover:text-gray-600">
                    <i data-lucide="bell" class="w-6 h-6"></i>
                    <span class="absolute top-1 right-1 w-2 h-2 bg-red-500 rounded-full"></span>
                </button>
                <div
                    class="w-10 h-10 rounded-full bg-gradient-to-tr from-purple-500 to-indigo-500 flex items-center justify-center text-white font-bold shadow-lg">
                    A</div>
            </div>
        </header>

        <!-- Content Scrollable -->
        <div class="flex-1 overflow-auto p-8 bg-gray-50 scroll-smooth">
            <!-- Stats Grid -->
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
                <!-- Stat Card 1 -->
                <div
                    class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 hover:shadow-lg transition-all duration-300 transform hover:-translate-y-1">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-sm font-medium text-gray-500 uppercase tracking-wider">Total Sales</p>
                            <p class="text-2xl font-bold text-gray-900 mt-1">₹ 24,500</p>
                        </div>
                        <div class="p-3 bg-green-50 rounded-xl text-green-600">
                            <i data-lucide="trending-up" class="w-6 h-6"></i>
                        </div>
                    </div>
                </div>

                <!-- Stat Card 2 -->
                <div
                    class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 hover:shadow-lg transition-all duration-300 transform hover:-translate-y-1">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-sm font-medium text-gray-500 uppercase tracking-wider">Orders</p>
                            <p class="text-2xl font-bold text-gray-900 mt-1">45</p>
                        </div>
                        <div class="p-3 bg-blue-50 rounded-xl text-blue-600">
                            <i data-lucide="shopping-cart" class="w-6 h-6"></i>
                        </div>
                    </div>
                </div>

                <!-- Stat Card 3 -->
                <div
                    class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 hover:shadow-lg transition-all duration-300 transform hover:-translate-y-1">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-sm font-medium text-gray-500 uppercase tracking-wider">Customers</p>
                            <p class="text-2xl font-bold text-gray-900 mt-1">128</p>
                        </div>
                        <div class="p-3 bg-purple-50 rounded-xl text-purple-600">
                            <i data-lucide="users" class="w-6 h-6"></i>
                        </div>
                    </div>
                </div>

                <!-- Stat Card 4 -->
                <div
                    class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 hover:shadow-lg transition-all duration-300 transform hover:-translate-y-1">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-sm font-medium text-gray-500 uppercase tracking-wider">Pending</p>
                            <p class="text-2xl font-bold text-gray-900 mt-1">12</p>
                        </div>
                        <div class="p-3 bg-orange-50 rounded-xl text-orange-600">
                            <i data-lucide="clock" class="w-6 h-6"></i>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Recent Orders Placeholders -->
            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                <div class="p-6 border-b border-gray-100 flex justify-between items-center bg-gray-50/50">
                    <h3 class="text-lg font-bold text-gray-900">Recent Orders</h3>
                    <a href="/admin/orders"
                        class="text-purple-600 hover:text-purple-800 text-sm font-medium flex items-center">
                        View All <i data-lucide="arrow-right" class="w-4 h-4 ml-1"></i>
                    </a>
                </div>
                <div class="p-6">
                    <div class="text-center text-gray-400 py-12 flex flex-col items-center justify-center">
                        <div class="bg-gray-50 p-4 rounded-full mb-4">
                            <i data-lucide="inbox" class="w-8 h-8 opacity-50"></i>
                        </div>
                        <p class="text-sm font-medium">No recent orders found</p>
                        <p class="text-xs mt-1 opacity-70">New orders will show up here</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        lucide.createIcons();
    </script>
</body>

</html>
