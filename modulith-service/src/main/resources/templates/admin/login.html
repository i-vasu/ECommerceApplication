<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Vasu Fashion</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; }
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body class="bg-gray-900 h-screen flex items-center justify-center relative overflow-hidden">
    <!-- Background Decor -->
    <div class="absolute top-0 left-0 w-full h-full">
        <div class="absolute top-[-10%] left-[-10%] w-96 h-96 bg-purple-500 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-blob"></div>
        <div class="absolute top-[-10%] right-[-10%] w-96 h-96 bg-indigo-500 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-blob animation-delay-2000"></div>
        <div class="absolute bottom-[-10%] left-[20%] w-96 h-96 bg-pink-500 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-blob animation-delay-4000"></div>
    </div>

    <div class="glass-panel p-10 rounded-2xl shadow-2xl w-full max-w-md relative z-10 transform transition-all duration-300">
        <div class="text-center mb-8">
            <h1 class="text-4xl font-bold text-gray-900 mb-2">Vasu Admin</h1>
            <p class="text-gray-600">Secure Access Portal</p>
        </div>
        
        <form th:action="@{/admin/login}" method="post" class="space-y-6">
            <div th:if="${param.error}" class="bg-red-50 border-l-4 border-red-500 text-red-700 p-4 rounded-md shadow-sm" role="alert">
                <p class="font-medium">Authentication Failed</p>
                <p class="text-sm">Invalid username or password.</p>
            </div>
            <div th:if="${param.logout}" class="bg-green-50 border-l-4 border-green-500 text-green-700 p-4 rounded-md shadow-sm" role="alert">
                <p class="font-medium">Success</p>
                <p class="text-sm">You have been logged out.</p>
            </div>
            
            <div class="space-y-2">
                <label class="block text-sm font-semibold text-gray-700 tracking-wide">Username</label>
                <input type="text" name="username" class="w-full px-4 py-3 bg-white/50 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-600 focus:border-transparent transition duration-200 backdrop-blur-sm" placeholder="admin@vasu.com" required>
            </div>
            
            <div class="space-y-2">
                <label class="block text-sm font-semibold text-gray-700 tracking-wide">Password</label>
                <input type="password" name="password" class="w-full px-4 py-3 bg-white/50 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-600 focus:border-transparent transition duration-200 backdrop-blur-sm" placeholder="••••••••" required>
            </div>

            <div class="flex items-center justify-between text-sm">
                <div class="flex items-center">
                    <input id="remember-me" name="remember-me" type="checkbox" class="h-4 w-4 text-purple-600 focus:ring-purple-500 border-gray-300 rounded">
                    <label for="remember-me" class="ml-2 block text-gray-600">Remember me</label>
                </div>
                <a href="#" class="text-purple-600 hover:text-purple-800 font-medium transition-colors">Forgot password?</a>
            </div>

            <button type="submit" class="w-full bg-gradient-to-r from-purple-600 to-indigo-600 text-white font-bold py-3 rounded-xl shadow-lg hover:shadow-purple-500/30 hover:scale-[1.02] transition duration-300 transform">
                Sign In
            </button>
        </form>
        
        <div class="mt-8 text-center text-xs text-gray-400">
            &copy; 2026 Vasu Fashion. All rights reserved.
        </div>
    </div>
</body>
</html>
