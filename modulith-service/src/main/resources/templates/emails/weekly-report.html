<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Weekly Business Performance Report</title>
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            line-height: 1.6;
            color: #1e293b;
            background: #f1f5f9;
            margin: 0;
            padding: 0;
        }

        .container {
            background: #ffffff;
            width: 100%;
            max-width: 800px;
            margin: 40px auto;
            padding: 40px;
            border-radius: 12px;
        }

        .header {
            background: #1e293b;
            color: white;
            padding: 30px;
            border-radius: 12px 12px 0 0;
            text-align: center;
        }

        .stat-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin: 30px 0;
        }

        .stat-card {
            flex: 1;
            min-width: 180px;
            background: #f8fafc;
            padding: 20px;
            border-radius: 8px;
            border-top: 4px solid #7c3aed;
            text-align: center;
        }

        .stat-value {
            font-size: 24px;
            font-weight: 800;
            color: #1e293b;
        }

        .stat-label {
            font-size: 13px;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th {
            text-align: left;
            padding: 12px;
            background: #f8fafc;
            border-bottom: 2px solid #e2e8f0;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #f1f5f9;
        }

        .footer {
            text-align: center;
            padding: 20px;
            font-size: 12px;
            color: #94a3b8;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>Weekly Performance Report</h1>
            <p th:text="${reportDate}">January 1 - January 7, 2026</p>
        </div>

        <div class="stat-grid">
            <div class="stat-card">
                <div class="stat-value" th:text="'₹' + ${totalRevenue}">₹0</div>
                <div class="stat-label">Net Revenue</div>
            </div>
            <div class="stat-card" style="border-top-color: #3b82f6;">
                <div class="stat-value" th:text="${orderCount}">0</div>
                <div class="stat-label">Total Orders</div>
            </div>
            <div class="stat-card" style="border-top-color: #10b981;">
                <div class="stat-value" th:text="${newUsers}">0</div>
                <div class="stat-label">New Customers</div>
            </div>
            <div class="stat-card" style="border-top-color: #f59e0b;">
                <div class="stat-value" th:text="${roiScore}">0%</div>
                <div class="stat-label">Mkt ROI</div>
            </div>
        </div>

        <h3>Top Selling Products</h3>
        <table>
            <thead>
                <tr>
                    <th>Product</th>
                    <th>Units Sold</th>
                    <th>Revenue</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="p : ${topProducts}">
                    <td th:text="${p.product_name}">Product</td>
                    <td th:text="${p.total_units_sold}">0</td>
                    <td th:text="'₹' + ${p.total_revenue}">₹0</td>
                </tr>
            </tbody>
        </table>

        <div class="footer">
            <p>Generated by Vaabhi Intelligence Engine</p>
        </div>
    </div>
</body>

</html>
