# PROD Profile Configuration (application-prod.properties)
# Enabled with -Dspring.profiles.active=prod

# Database - Production specific
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.jpa.show-sql=false

# Payment - Razorpay (PROD)
razorpay.key.id=${RAZORPAY_PROD_KEY_ID}
razorpay.key.secret=${RAZORPAY_PROD_KEY_SECRET}
razorpay.webhook.secret=${RAZORPAY_PROD_WEBHOOK_SECRET}

# Shipping - Shiprocket (PROD)
shiprocket.email=${SHIPROCKET_PROD_EMAIL}
shiprocket.password=${SHIPROCKET_PROD_PASSWORD}
shiprocket.channel.id=${SHIPROCKET_PROD_CHANNEL_ID}

# ERPNext (PROD)
erpnext.base-url=${ERPNEXT_PROD_URL}
erpnext.api.key=${ERPNEXT_PROD_API_KEY}
erpnext.api.secret=${ERPNEXT_PROD_API_SECRET}

# Logging
logging.level.root=INFO
logging.level.com.app=INFO
