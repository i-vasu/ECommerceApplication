# Default Active Profile
spring.profiles.active=dev

# Marketplace Config
marketplace.amazon.secret=${MARKETPLACE_AMAZON_SECRET:amazon_mock_secret}
marketplace.flipkart.secret=${MARKETPLACE_FLIPKART_SECRET:flipkart_mock_secret}
marketplace.ondc.secret=${MARKETPLACE_ONDC_SECRET:ondc_mock_secret}

# OAuth2 Configuration (Dummy to prevent startup failure)
spring.security.oauth2.client.registration.google.client-id=mock-client-id
spring.security.oauth2.client.registration.google.client-secret=mock-client-secret

# Actuator & Monitoring
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.prometheus.metrics.export.enabled=true
management.metrics.tags.application=${spring.application.name}

# Tracing (Micrometer + Brave)
management.tracing.sampling.probability=1.0
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]

# Detailed SQL & DDL Logging
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.results=DEBUG
logging.level.org.hibernate.tool.schema=DEBUG
