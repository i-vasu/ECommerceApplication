# Default configuration (Common for all profiles)
spring.application.name=modulith-service
spring.threads.virtual.enabled=true
spring.main.lazy-initialization=false
spring.main.allow-bean-definition-overriding=true

# Database Configuration (Common)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${JAVA_DB_USERNAME}
spring.datasource.password=${JAVA_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Tuning
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.pool-name=VaabhiHikariPool

# JPA & Hibernate (Optimized Startup)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.scan.packages=com.app,org.springframework.modulith.events.jpa
spring.jpa.open-in-view=false

# Flyway Migration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Security
jwt.secret=${JWT_SECRET}

# Common Integrations
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:noreply@example.com}
spring.mail.password=${MAIL_PASSWORD:default_password}

# Razorpay Config (Global and Multitenant)
razorpay.key.id=${RAZORPAY_TEST_KEY_ID:rzp_test_S5MEGtoqd7w5Pb}
razorpay.key.secret=${RAZORPAY_TEST_KEY_SECRET:xFvJG9JDtC13t3ARmvMBbAWs}
razorpay.webhook.secret=${RAZORPAY_TEST_WEBHOOK_SECRET:webhook_secret_keyha@123}

razorpay.test.key.id=${RAZORPAY_TEST_KEY_ID:rzp_test_S5MEGtoqd7w5Pb}
razorpay.test.key.secret=${RAZORPAY_TEST_KEY_SECRET:xFvJG9JDtC13t3ARmvMBbAWs}
razorpay.test.webhook.secret=${RAZORPAY_TEST_WEBHOOK_SECRET:webhook_secret_keyha@123}

razorpay.prod.key.id=${RAZORPAY_PROD_KEY_ID:}
razorpay.prod.key.secret=${RAZORPAY_PROD_KEY_SECRET:}
razorpay.prod.webhook.secret=${RAZORPAY_PROD_WEBHOOK_SECRET:}

# Shiprocket Config
shiprocket.email=${SHIPROCKET_TEST_EMAIL:your_shiprocket_email@example.com}
shiprocket.password=${SHIPROCKET_TEST_PASSWORD:your_shiprocket_password}
shiprocket.channel.id=${SHIPROCKET_TEST_CHANNEL_ID:}

shiprocket.test.email=${SHIPROCKET_TEST_EMAIL:your_shiprocket_email@example.com}
shiprocket.test.password=${SHIPROCKET_TEST_PASSWORD:your_shiprocket_password}
shiprocket.test.channel.id=${SHIPROCKET_TEST_CHANNEL_ID:}

shiprocket.prod.email=${SHIPROCKET_PROD_EMAIL:vaabhiofficial@gmail.com}
shiprocket.prod.password=${SHIPROCKET_PROD_PASSWORD:Charitha@23.}
shiprocket.prod.channel.id=${SHIPROCKET_PROD_CHANNEL_ID:9308067}

spring.profiles.active=dev

# Marketplace Config
marketplace.amazon.secret=${MARKETPLACE_AMAZON_SECRET:amazon_mock_secret}
marketplace.flipkart.secret=${MARKETPLACE_FLIPKART_SECRET:flipkart_mock_secret}
marketplace.ondc.secret=${MARKETPLACE_ONDC_SECRET:ondc_mock_secret}

# Payment Orchestration (Hyperswitch)
hyperswitch.api.key=${HYPERSWITCH_API_KEY:mock_key}
hyperswitch.merchant.id=${HYPERSWITCH_MERCHANT_ID:mock_merchant}

# Beckn Protocol (ONDC)
beckn.bpp.id=fashion-store-bpp
beckn.bpp.uri=https://api.fashion-store.com/api/v1/beckn
beckn.registry.url=https://pilot-gateway-1.becknprotocol.io/

# OAuth2 Configuration (Dummy to prevent startup failure)
spring.security.oauth2.client.registration.google.client-id=mock-client-id
spring.security.oauth2.client.registration.google.client-secret=mock-client-secret

# Actuator & Monitoring (Spring Native)
springdoc.show-actuator=true
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.prometheus.metrics.export.enabled=true
management.metrics.tags.application=${spring.application.name}
management.tracing.sampling.probability=1.0
management.observations.annotations.enabled=true
# External Watchdog (Dead-Man's Switch URL)
monitoring.watchdog.heartbeat-url=${WATCHDOG_URL:http://health-check.example.com/ping}
monitoring.watchdog.enabled=true

# High-Resolution Latency Tracking (p95, p99)
management.metrics.export.prometheus.descriptions=true
management.metrics.distribution.percentiles-histogram.all=true
management.metrics.distribution.percentiles.all=0.5, 0.95, 0.99

# Spring Boot Admin (Internal)
spring.boot.admin.client.url=http://localhost:8080
spring.boot.admin.client.instance.service-url=http://localhost:8080
spring.boot.admin.client.instance.management-url=http://localhost:8080/actuator
spring.boot.admin.client.instance.name=VaabhiFashionSuite

# Vaadin Configuration
vaadin.allowed-packages=com.app.support.admin.views,com.app.admin.views
vaadin.productionMode=false

# Tracing (OpenTelemetry + OTLP)
management.tracing.sampling.probability=1.0
management.otlp.tracing.endpoint=http://localhost:4318/v1/traces
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]

# Detailed SQL & DDL Logging
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.results=DEBUG
logging.level.org.hibernate.tool.schema=DEBUG

# Resilience4j Configuration
resilience4j.circuitbreaker.configs.default.registerHealthIndicator=true
resilience4j.circuitbreaker.configs.default.slidingWindowSize=10
resilience4j.circuitbreaker.configs.default.minimumNumberOfCalls=5
resilience4j.circuitbreaker.configs.default.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.configs.default.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.configs.default.waitDurationInOpenState=5s
resilience4j.circuitbreaker.configs.default.failureRateThreshold=50
resilience4j.circuitbreaker.configs.default.eventConsumerBufferSize=10

resilience4j.circuitbreaker.instances.razorpay.baseConfig=default
resilience4j.circuitbreaker.instances.hyperswitch.baseConfig=default
resilience4j.circuitbreaker.instances.inventory.baseConfig=default

resilience4j.retry.configs.default.maxAttempts=3
resilience4j.retry.configs.default.waitDuration=2s
resilience4j.retry.configs.default.enableExponentialBackoff=true
resilience4j.retry.configs.default.exponentialBackoffMultiplier=2

resilience4j.retry.instances.razorpay.baseConfig=default
resilience4j.retry.instances.hyperswitch.baseConfig=default
resilience4j.retry.instances.hyperswitch.baseConfig=default
resilience4j.retry.instances.inventory.baseConfig=default

# Zoho Books Integration
zoho.books.enabled=true
zoho.books.base-url=https://www.zohoapis.in/books/v3
zoho.books.auth-url=https://accounts.zoho.in/oauth/v2/token
zoho.books.client-id=${ZOHO_CLIENT_ID:INSERT_CLIENT_ID}
zoho.books.client-secret=${ZOHO_CLIENT_SECRET:INSERT_CLIENT_SECRET}
zoho.books.refresh-token=${ZOHO_REFRESH_TOKEN:INSERT_REFRESH_TOKEN}
zoho.books.organization-id=${ZOHO_ORG_ID:INSERT_ORG_ID}

# Meta Cloud API (WhatsApp)
meta.cloud.api.base-url=${META_API_BASE_URL:https://graph.facebook.com/v19.0}
meta.cloud.api.phone-number-id=${META_PHONE_NUMBER_ID:}
meta.cloud.api.access-token=${META_ACCESS_TOKEN:}
meta.cloud.api.waba-id=${META_WABA_ID:}

# Google SMTP Server
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Google Merchant API
google.merchant.api.merchant-id=${GOOGLE_MERCHANT_ID:}
google.merchant.api.service-account-key=${GOOGLE_SERVICE_ACCOUNT_KEY:}


# OpenAI Configuration (for AI Design features)
openai.api.key=${OPENAI_API_KEY:}

# Virtual Try-On API (Google Vertex AI / Fal.ai)
vton.api.url=${VTON_API_URL:https://api.fal.ai/v1/virtual-try-on}
vton.api.key=${VTON_API_KEY:}
