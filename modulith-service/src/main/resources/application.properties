# Default configuration (Common for all profiles)
spring.application.name=modulith-service
spring.threads.virtual.enabled=true

# Database Configuration (Common)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${JAVA_DB_USERNAME}
spring.datasource.password=${JAVA_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=create
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.scan.packages=com.app,org.springframework.modulith.events.jpa

# Redis Configuration (Common)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Security
jwt.secret=${JWT_SECRET}

# Common Integrations
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:noreply@example.com}
spring.mail.password=${MAIL_PASSWORD:default_password}

