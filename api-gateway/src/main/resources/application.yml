server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: product-service
          uri: lb://PRODUCT-SERVICE
          predicates:
            - Path=/api/public/products/**, /api/public/categories/**, /api/admin/products/**, /api/admin/categories/**

        - id: order-service
          uri: lb://ORDER-SERVICE
          predicates:
            - Path=/api/**

        - id: marketplace-service
          uri: lb://MARKETPLACE-SERVICE
          predicates:
            - Path=/webhooks/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
