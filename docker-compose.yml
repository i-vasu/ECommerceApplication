version: '3.8'

services:
  db:
    image: paradedb/paradedb:latest # PostgreSQL 16 + search extensions
    container_name: postgres
    restart: always
    environment:
      POSTGRES_DB: ${postgres_db:-dev}
      POSTGRES_USER: ${JAVA_DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${JAVA_DB_PASSWORD:-123Vasu456}
    volumes:
      - ${DATA_ROOT:-../ecommerce-data}/postgres:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    command: postgres
    deploy:
      resources:
        limits:
          memory: 1G # Increased from 768M for better performance
    networks:
      - ecommerce-net

  redis:
    image: redis:alpine
    container_name: redis
    restart: always
    ulimits:
      memlock: -1
    ports:
      - "6379:6379"
    volumes:
      - ${DATA_ROOT:-../ecommerce-data}/redis:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M # Redis usually needs less than Dragonfly for this scale
    networks:
      - ecommerce-net

  caddy:
    image: caddy:latest
    container_name: caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - ecommerce-net
    deploy:
      resources:
        limits:
          memory: 128M

  # Legacy services removed in favor of modular monolith

  dittofeed:
    image: dittofeed/dittofeed-lite:latest
    container_name: marketing-dittofeed
    restart: always
    ports:
      - "3301:3000"
    deploy:
      resources:
        limits:
          memory: 256M # Reduced from 512M for admin-only
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${JAVA_DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${JAVA_DB_PASSWORD:-123Vasu456}
      POSTGRES_DB: dittofeed
      REDIS_URL: redis://redis:6379
      ADMIN_API_KEY: "password"
      NODE_OPTIONS: "--max-old-space-size=192"
    networks:
      - ecommerce-net

  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    container_name: marketing-umami
    restart: always
    ports:
      - "3300:3000"
    environment:
      DATABASE_URL: postgresql://${JAVA_DB_USERNAME:-postgres}:${JAVA_DB_PASSWORD:-123Vasu456}@postgres:5432/umami
      HASH_SALT: "ReplaceMeWithARandomString"
    deploy:
      resources:
        limits:
          memory: 128M # Reduced from 256M for admin-only
    networks:
      - ecommerce-net

  metabase:
    image: metabase/metabase:latest
    container_name: analytics-metabase
    restart: always
    ports:
      - "3302:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_PORT: 5432
      MB_DB_USER: ${JAVA_DB_USERNAME:-postgres}
      MB_DB_PASS: ${JAVA_DB_PASSWORD:-123Vasu456}
      MB_DB_HOST: postgres
      # Optimization for admin-only usage
      JAVA_OPTS: "-Xmx384m -Xms128m -XX:MaxMetaspaceSize=128m"
      MB_JETTY_MAX_THREADS: 10
    deploy:
      resources:
        limits:
          memory: 512M # Reduced from 1G for admin-only
    networks:
      - ecommerce-net

  postgres-backup:
    image: prodrigestivill/postgres-backup-local
    container_name: postgres-backup
    restart: always
    depends_on:
      - db
    volumes:
      - ${BACKUP_ROOT:-../ecommerce-backups}:/backups
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${postgres_db:-dev}
      POSTGRES_USER: ${JAVA_DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${JAVA_DB_PASSWORD:-123Vasu456}
      POSTGRES_EXTRA_OPTS: "-Z9 --schema=public --blobs"
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: 7
      BACKUP_KEEP_WEEKS: 4
      BACKUP_KEEP_MONTHS: 6
      HEALTHCHECK_PORT: 8080
    deploy:
      resources:
        limits:
          memory: 128M # Reduced from 256M for 8GB target
    networks:
      - ecommerce-net

  modulith-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: modulith-service:latest
    container_name: modulith-service
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks:
      - ecommerce-net
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${postgres_db:-dev}
      JAVA_DB_USERNAME: ${JAVA_DB_USERNAME:-postgres}
      JAVA_DB_PASSWORD: ${JAVA_DB_PASSWORD:-123Vasu456}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JAVA_OPTS: "-Xmx1g -Xms512m -XX:+UseZGC -XX:+ZGenerational"

networks:
  ecommerce-net:
    external: true

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
