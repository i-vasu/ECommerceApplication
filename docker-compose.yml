version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: java-db
    restart: always
    environment:
      POSTGRES_DB: ${postgres_db:-dev}
      POSTGRES_USER: ${JAVA_DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${JAVA_DB_PASSWORD:-123Vasu456}
      POSTGRES_MULTIPLE_DATABASES: keycloak,dittofeed,umami,metabase
    volumes:
      - ${DATA_ROOT:-../ecommerce-data}/postgres:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: 'dragonflydb/dragonfly'
    container_name: dragonfly
    restart: always
    ulimits:
      memlock: -1
    ports:
      - "6379:6379"
    volumes:
      - ${DATA_ROOT:-../ecommerce-data}/dragonfly:/data

  meilisearch:
    image: getmeili/meilisearch:v1.6
    container_name: search-meilisearch
    restart: always
    ports:
      - "7700:7700"
    environment:
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY:-masterKey}
    volumes:
      - ${DATA_ROOT:-../ecommerce-data}/meilisearch:/meili_data

  discovery-server:
    image: eclipse-temurin:21-jdk-alpine
    container_name: discovery-server
    working_dir: /app
    volumes:
      - ./discovery-server/target:/app/target
    command: java -jar target/discovery-server-0.0.1-SNAPSHOT.jar
    ports:
      - "8761:8761"

  api-gateway:
    image: eclipse-temurin:21-jdk-alpine
    container_name: api-gateway
    working_dir: /app
    volumes:
      - ./api-gateway/target:/app/target
    depends_on:
      - discovery-server
    command: java -jar target/api-gateway-0.0.1-SNAPSHOT.jar
    ports:
      - "8080:8080"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka

  order-service:
    image: eclipse-temurin:21-jdk-alpine
    container_name: order-service
    working_dir: /app
    volumes:
      - ./order-service/target:/app/target
    command: java -jar target/order-service-0.0.1-SNAPSHOT.jar
    restart: always
    depends_on:
      - db
      - discovery-server
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${postgres_db:-dev}
      JAVA_DB_USERNAME: ${JAVA_DB_USERNAME:-postgres}
      JAVA_DB_PASSWORD: ${JAVA_DB_PASSWORD:-123Vasu456}
      JAVA_JWT_SECRET: ${JAVA_JWT_SECRET}
      ERPNEXT_API_URL: ${ERPNEXT_API_URL}
      ERPNEXT_API_KEY: ${ERPNEXT_API_KEY}
      ERPNEXT_API_SECRET: ${ERPNEXT_API_SECRET}
      REDIS_HOST: ${REDIS_HOST_DOCKER:-redis}
      REDIS_PORT: 6379
      SW_AGENT_NAME: ${SW_AGENT_NAME:-order-service}
      SW_AGENT_COLLECTOR_BACKEND_SERVICES: ${SW_OAP_ADDRESS_DOCKER:-skywalking-oap:11800}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT_DOCKER:-http://minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-fashion-store}
      KC_ISSUER_URI: http://keycloak:8080/realms/fashion-store
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka
      PRODUCT_SERVICE_URL: http://product-service:8082

  product-service:
    image: eclipse-temurin:21-jdk-alpine
    container_name: product-service
    working_dir: /app
    volumes:
      - ./product-service/target:/app/target
    command: java -jar target/product-service-0.0.1-SNAPSHOT.jar
    restart: always
    depends_on:
      - db
      - discovery-server
    ports:
      - "8083:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${postgres_db:-dev}
      JAVA_DB_USERNAME: ${JAVA_DB_USERNAME:-postgres}
      JAVA_DB_PASSWORD: ${JAVA_DB_PASSWORD:-123Vasu456}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka

  marketplace-service:
    image: eclipse-temurin:21-jdk-alpine
    container_name: marketplace-service
    working_dir: /app
    volumes:
      - ./marketplace-service/target:/app/target
    command: java -jar target/marketplace-service-0.0.1-SNAPSHOT.jar
    restart: always
    depends_on:
      - db
      - discovery-server
    ports:
      - "8086:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${postgres_db:-dev}
      JAVA_DB_USERNAME: ${JAVA_DB_USERNAME:-postgres}
      JAVA_DB_PASSWORD: ${JAVA_DB_PASSWORD:-123Vasu456}
      REDIS_HOST: ${REDIS_HOST_DOCKER:-redis}
      REDIS_PORT: 6379
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka
      # Secrets
      AMAZON_WEBHOOK_SECRET: ${AMAZON_WEBHOOK_SECRET:-mock-amazon}
      FLIPKART_WEBHOOK_SECRET: ${FLIPKART_WEBHOOK_SECRET:-mock-flipkart}
      ONDC_WEBHOOK_SECRET: ${ONDC_WEBHOOK_SECRET:-mock-ondc}

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: java-keycloak
    restart: always
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/keycloak
      KC_DB_USERNAME: ${JAVA_DB_USERNAME:-postgres}
      KC_DB_PASSWORD: ${JAVA_DB_PASSWORD:-123Vasu456}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:-admin}
      KC_DEBUG: "true"
      KC_LOG_LEVEL: "INFO"
    ports:
      - "8084:8080"
    depends_on:
      db:
        condition: service_healthy
    command: start-dev

  crowdsec:
    image: crowdsecurity/crowdsec:latest
    container_name: security-crowdsec
    restart: always
    environment:
      GID: "${GID-1000}"
      COLLECTIONS: "crowdsecurity/linux crowdsecurity/traefik crowdsecurity/http-cve"
    volumes:
      - ${DATA_ROOT:-../ecommerce-data}/crowdsec/config:/etc/crowdsec
      - ${DATA_ROOT:-../ecommerce-data}/crowdsec/data:/var/lib/crowdsec/data
      - /var/run/docker.sock:/var/run/docker.sock

  dittofeed:
    image: dittofeed/dittofeed-lite:latest
    container_name: marketing-dittofeed
    restart: always
    ports:
      - "3301:3000"
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${JAVA_DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${JAVA_DB_PASSWORD:-123Vasu456}
      POSTGRES_DB: dittofeed
      REDIS_URL: redis://redis:6379
      ADMIN_API_KEY: "password"

  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    container_name: marketing-umami
    restart: always
    ports:
      - "3300:3000"
    environment:
      DATABASE_URL: postgresql://${JAVA_DB_USERNAME:-postgres}:${JAVA_DB_PASSWORD:-123Vasu456}@db:5432/umami
      HASH_SALT: "ReplaceMeWithARandomString"

  metabase:
    image: metabase/metabase:latest
    container_name: analytics-metabase
    restart: always
    ports:
      - "3302:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_PORT: 5432
      MB_DB_USER: ${JAVA_DB_USERNAME:-postgres}
      MB_DB_PASS: ${JAVA_DB_PASSWORD:-123Vasu456}
      MB_DB_HOST: db

volumes:
  postgres_data:
