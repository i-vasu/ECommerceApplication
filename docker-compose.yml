version: '3.8'

services:
  db:
    image: paradedb/paradedb:latest # PostgreSQL 16 + search extensions
    container_name: postgres
    restart: always
    environment:
      POSTGRES_DB: ${postgres_db:-dev}
      POSTGRES_USER: ${JAVA_DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${JAVA_DB_PASSWORD:-123Vasu456}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    command: postgres
    deploy:
      resources:
        limits:
          memory: 1G # Increased from 768M for better performance
    networks:
      - ecommerce-net

  dragonfly:
    image: 'ghcr.io/dragonflydb/dragonfly:latest'
    container_name: dragonfly
    restart: always
    ulimits:
      memlock: -1
    ports:
      - "6379:6379"
    volumes:
      - ${DATA_ROOT:-../ecommerce-data}/dragonfly:/data
    command: >
      dragonfly --proactor_threads=1 --maxmemory 850mb
    healthcheck:
      test: [ "CMD", "redis-cli", "--raw", "incr", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G # Increased from 768M for better cache performance
    networks:
      - ecommerce-net

  caddy:
    image: caddy:latest
    container_name: caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - ecommerce-net
    deploy:
      resources:
        limits:
          memory: 128M
      # Legacy/External services removed in favor of modular monolith native features
  # Dittofeed (Retention) -> Replaced by Spring Batch + Spring Mail
  # Metabase (Dashboards) -> Replaced by Vaadin + Analytical Views

  # Observability Stack
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: always
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    networks:
      - ecommerce-net

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    networks:
      - ecommerce-net

  loki:
    image: grafana/loki:latest
    container_name: loki
    restart: always
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3100/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    networks:
      - ecommerce-net

  tempo:
    image: grafana/tempo:latest
    container_name: tempo
    restart: always
    command: [ "-config.file=/etc/tempo.yaml" ]
    volumes:
      - ./config/tempo.yaml:/etc/tempo.yaml
    ports:
      - "3200:3200" # Tempo HTTP
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3200/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    networks:
      - ecommerce-net

  alloy:
    image: grafana/alloy:latest
    container_name: alloy
    restart: always
    volumes:
      - ./config/alloy.config:/etc/alloy/config.alloy
    ports:
      - "12345:12345"
    command: [ "run", "--server.http.listen-addr=0.0.0.0:12345", "/etc/alloy/config.alloy" ]
    networks:
      - ecommerce-net

  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    container_name: marketing-umami
    restart: always
    ports:
      - "3300:3000"
    environment:
      DATABASE_URL: postgresql://${JAVA_DB_USERNAME:-postgres}:${JAVA_DB_PASSWORD:-123Vasu456}@postgres:5432/umami
      HASH_SALT: "ReplaceMeWithARandomString"
    deploy:
      resources:
        limits:
          memory: 128M # Reduced from 256M for admin-only
    networks:
      - ecommerce-net

  postgres-backup:
    image: prodrigestivill/postgres-backup-local
    container_name: postgres-backup
    restart: always
    depends_on:
      - db
    volumes:
      - ${BACKUP_ROOT:-../ecommerce-backups}:/backups
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${postgres_db:-dev}
      POSTGRES_USER: ${JAVA_DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${JAVA_DB_PASSWORD:-123Vasu456}
      POSTGRES_EXTRA_OPTS: "-Z9 --schema=public --blobs"
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: 7
      BACKUP_KEEP_WEEKS: 4
      BACKUP_KEEP_MONTHS: 6
      HEALTHCHECK_PORT: 8080
    deploy:
      resources:
        limits:
          memory: 128M # Reduced from 256M for 8GB target
    networks:
      - ecommerce-net

  modulith-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: modulith-service:latest
    container_name: modulith-service
    restart: always
    depends_on:
      db:
        condition: service_healthy
      dragonfly:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks:
      - ecommerce-net
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${postgres_db:-dev}
      JAVA_DB_USERNAME: ${JAVA_DB_USERNAME:-postgres}
      JAVA_DB_PASSWORD: ${JAVA_DB_PASSWORD:-123Vasu456}
      REDIS_HOST: dragonfly
      REDIS_PORT: 6379
      JAVA_OPTS: "-Xmx1g -Xms512m -XX:+UseZGC -XX:+ZGenerational"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G

networks:
  ecommerce-net:
    external: true

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  grafana_data:
