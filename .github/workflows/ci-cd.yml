name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        test-suite: 
          - unit
          - integration
          - e2e
          - architecture
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      
      - name: Install Playwright dependencies
        if: matrix.test-suite == 'e2e'
        run: |
          mvn exec:java -pl automation-tests -e -D exec.mainClass=com.microsoft.playwright.CLI -D exec.args="install --with-deps chromium"
      
      - name: Run Unit Tests
        if: matrix.test-suite == 'unit'
        run: |
          mvn test -pl modulith-order,modulith-product,modulith-service -Dtest='*Test'
      
      - name: Run Integration Tests
        if: matrix.test-suite == 'integration'
        run: |
          mvn test -pl modulith-order,modulith-product,modulith-service -Dtest='*IntegrationTest'
      
      - name: Run E2E Tests
        if: matrix.test-suite == 'e2e'
        run: |
          mvn test -pl automation-tests -Dtest='*E2ETest,*FlowTest'
      
      - name: Run Architecture Tests
        if: matrix.test-suite == 'architecture'
        run: |
          mvn test -pl modulith-service -Dtest=ArchitectureTest
      
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.test-suite }}
          path: |
            **/target/surefire-reports/**
            **/target/site/jacoco/**
      
      - name: Publish Test Report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: ${{ matrix.test-suite }} Tests
          path: '**/target/surefire-reports/TEST-*.xml'
          reporter: java-junit

  quality-gate:
    name: Quality Gates
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      
      - name: Run Code Coverage
        run: mvn verify jacoco:report
      
      - name: Check Coverage Threshold
        run: |
          mvn jacoco:check -Djacoco.haltOnFailure=true -Djacoco.minimumCoverage=0.60
      
      - name: SonarQube Scan
        if: github.event_name == 'push'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn sonar:sonar \
            -Dsonar.projectKey=ecommerce-app \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.token=$SONAR_TOKEN
      
      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./target/site/jacoco/jacoco.xml
          flags: unittests
          name: codecov-umbrella

  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run Dependency Check
        run: mvn org.owasp:dependency-check-maven:check
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
      
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

  build:
    name: Build & Package
    runs-on: ubuntu-latest
    needs: [test, quality-gate, security-scan]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      
      - name: Build with Maven
        run: mvn clean package -DskipTests
      
      - name: Build Docker images
        run: |
          docker-compose build
      
      - name: Push to Container Registry
        if: github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
          docker-compose push
