name: Java CI/CD

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: dev
          POSTGRES_PASSWORD: 123Vasu456
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
        
    - name: Run Tests
      run: mvn -B test
      env:
        SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/dev
        JAVA_DB_USERNAME: postgres
        JAVA_DB_PASSWORD: 123Vasu456
        JAVA_JWT_SECRET: ci_test_secret
        ERPNEXT_API_KEY: mock_key
        ERPNEXT_API_SECRET: mock_secret

    - name: Build Package
      run: mvn -B package -DskipTests

    - name: Build Docker image
      run: |
        docker build -t ecommerce-middleware:latest .
