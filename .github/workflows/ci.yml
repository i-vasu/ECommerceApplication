name: Comprehensive CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend Tests & Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'liberica'
          cache: maven

      - name: Start Services (Docker Compose)
        run: |
          docker compose up -d db dragonfly
          # Wait for healthy
          sleep 10

      - name: Build and Test with JaCoCo
        run: mvn clean verify -DskipTests=false
        working-directory: ./ECommerceApplication

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: ECommerceApplication/target/site/jacoco-aggregate/

  frontend-test:
    name: Frontend E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: vaabhi-storefront/package-lock.json

      - name: Install dependencies
        run: npm install
        working-directory: ./vaabhi-storefront

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
        working-directory: ./vaabhi-storefront

      - name: Run Playwright tests
        run: npx playwright test
        working-directory: ./vaabhi-storefront
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: vaabhi-storefront/playwright-report/
