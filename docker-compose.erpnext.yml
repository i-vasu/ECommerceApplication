version: '3'

services:
  # 1. Specialized Database for ERPNext (Required)
  mariadb:
    image: mariadb:10.6
    container_name: erpnext-db
    restart: always
    command: >
      --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --skip-character-set-client-handshake --skip-innodb-read-only-compressed --innodb-buffer-pool-size=256M --max-connections=50 --table-open-cache=200
    environment:
      MYSQL_ROOT_PASSWORD: admin
      MYSQL_DATABASE: erpnext
      MYSQL_USER: erpnext
      MYSQL_PASSWORD: erpnext
    volumes:
      - erpnext-db-data:/var/lib/mysql
    deploy:
      resources:
        limits:
          memory: 384M # Reduced from 512M for admin-only
    networks:
      - ecommerce-net

  # 2. The Core Application (Headless Mode Optimized)
  erpnext-backend:
    image: frappe/erpnext:v16.0.0
    container_name: erpnext-backend
    restart: always
    deploy:
      resources:
        limits:
          memory: 384M # Reduced from 1G for admin-only
    environment:
      DB_HOST: erpnext-db
      DB_PORT: 3306
      DB_PASSWORD: erpnext
      ROUTING_WEBSITE_REDIRECT: /api
      # Optimization for admin-only usage
      GUNICORN_WORKERS: 4
      GUNICORN_TIMEOUT: 120
    # Removed public port mapping to proxy through Nginx
    expose:
      - "8000"
    volumes:
      - erpnext-sites:/home/frappe/frappe-bench/sites
    depends_on:
      - mariadb
    networks:
      - ecommerce-net

  # 2.5. Frontend / Assets Server (Nginx)
  erpnext-nginx:
    image: frappe/erpnext:v16.0.0
    container_name: erpnext-nginx
    user: root
    command: nginx -g 'daemon off;'
    restart: always
    ports:
      - "8000:80" # Expose ERPNext on port 8000
    volumes:
      - erpnext-sites:/home/frappe/frappe-bench/sites
      - ./erpnext-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - erpnext-backend
    networks:
      - ecommerce-net
    deploy:
      resources:
        limits:
          memory: 128M

  # 3. Queue Worker (Consolidated)
  erpnext-worker:
    image: frappe/erpnext:v16.0.0
    container_name: erpnext-worker
    command: bench worker --queue default,short,long
    restart: always
    deploy:
      resources:
        limits:
          memory: 128M # Reduced from 512M for admin-only
    environment:
      DB_HOST: mariadb
      DB_PASSWORD: erpnext
      REDIS_CACHE: redis://dragonfly:6379
      REDIS_QUEUE: redis://dragonfly:6379
      REDIS_SOCKETIO: redis://dragonfly:6379
    volumes:
      - erpnext-sites:/home/frappe/frappe-bench/sites
    depends_on:
      - mariadb
    networks:
      - ecommerce-net

  # 4. Scheduler (Lightweight - Runs CRON jobs)
  erpnext-schedule:
    image: frappe/erpnext:v16.0.0
    container_name: erpnext-schedule
    command: bench schedule
    restart: always
    deploy:
      resources:
        limits:
          memory: 128M # Reduced from 256M for admin-only
    environment:
      DB_HOST: mariadb
      DB_PASSWORD: erpnext
      REDIS_CACHE: redis://dragonfly:6379
      REDIS_QUEUE: redis://dragonfly:6379
    volumes:
      - erpnext-sites:/home/frappe/frappe-bench/sites
    depends_on:
      - mariadb
    networks:
      - ecommerce-net

networks:
  ecommerce-net:
    external: true

volumes:
  erpnext-db-data:
  erpnext-sites:
