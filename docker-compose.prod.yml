version: '3.8'

services:
  db:
    image: paradedb/paradedb:latest
    container_name: postgres-prod
    restart: always
    environment:
      POSTGRES_DB: ${postgres_db:-prod}
      POSTGRES_USER: ${JAVA_DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${JAVA_DB_PASSWORD:-123Vasu456}
    volumes:
      - ${DATA_ROOT:-../ecommerce-data}/postgres-prod:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    command: postgres -c shared_buffers=1GB -c work_mem=16MB -c max_connections=200
    deploy:
      resources:
        limits:
          memory: 4G # VERTICAL SCALING: Increased from 1G
          cpus: '2.0'
    networks:
      - ecommerce-prod-net

  dragonfly:
    image: 'ghcr.io/dragonflydb/dragonfly:latest'
    container_name: dragonfly-prod
    restart: always
    ulimits:
      memlock: -1
    ports:
      - "6379:6379"
    volumes:
      - ${DATA_ROOT:-../ecommerce-data}/dragonfly-prod:/data
    command: >
      dragonfly --proactor_threads=2 --maxmemory 2048mb
    deploy:
      resources:
        limits:
          memory: 2G # VERTICAL SCALING: Increased from 1G
    networks:
      - ecommerce-prod-net

  modulith-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: modulith-service:prod
    container_name: modulith-service-prod
    restart: always
    depends_on:
      - db
      - dragonfly
    ports:
      - "8080:8080"
    networks:
      - ecommerce-prod-net
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${postgres_db:-prod}
      JAVA_DB_USERNAME: ${JAVA_DB_USERNAME:-postgres}
      JAVA_DB_PASSWORD: ${JAVA_DB_PASSWORD:-123Vasu456}
      REDIS_HOST: dragonfly
      REDIS_PORT: 6379
      # ZERO COST TUNING
      JAVA_OPTS: "-Xmx3g -Xms2g -XX:+UseZGC -XX:+ZGenerational"
    deploy:
      replicas: 1 # Can scale to 3 if needed
      resources:
        limits:
          memory: 4G
          cpus: '2.0'

networks:
  ecommerce-prod-net:
    driver: bridge
